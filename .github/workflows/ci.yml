name: Game checks
on:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Calendar/dialogue fixtures use the documented reference timezone.
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: bash -n scripts/playtest-macos.sh
      - run: npm run typecheck
      - run: npm test -- --testTimeout 30000
      - run: npm run build
