name: Unity Editor Import, Compile and Tests

on:
  pull_request:
    paths:
      - 'IdleIntelligence/**'
      - '.github/workflows/unity-editor-validation.yml'
  workflow_dispatch:

# The Unity Editor needs a separately activated seat/license.
# Configure the UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD repository
# secrets before the job can invoke Unity. Missing credentials fail the gate
# rather than silently claiming a green Editor validation.
jobs:
  unity-editor:
    name: Unity 6000.3.26f1 EditMode and PlayMode
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - name: Check Unity activation secrets are available
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [[ -z "$UNITY_LICENSE" || -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ]]; then
            echo "::error::Unity Editor tests cannot run: configure UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD as repository secrets."
            exit 1
          fi
      - name: Unity Editor tests (includes import/compile)
        id: unity
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: IdleIntelligence
          unityVersion: 6000.3.26f1
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          artifactsPath: artifacts/unity-editor
      - name: Upload Unity test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editor-test-reports
          path: artifacts/unity-editor
          if-no-files-found: warn
