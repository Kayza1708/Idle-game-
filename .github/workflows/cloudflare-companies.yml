name: Cloudflare Companies API
on:
  pull_request:
    paths:
      - 'cloudflare/company-api/**'
      - '.github/workflows/cloudflare-companies.yml'
  push:
    branches: [main]
    paths:
      - 'cloudflare/company-api/**'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/company-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove standalone Worker does not require TypeScript game or web runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/legacy-web"
          for item in src scripts public package.json package-lock.json index.html; do
            if [ -e "../../$item" ]; then
              mv "../../$item" "$RUNNER_TEMP/legacy-web/"
            fi
          done
          test ! -e ../../src
          test ! -e ../../package.json
      - name: Install Cloudflare Wrangler
        run: npm install --no-audit --no-fund
      - name: Pure Company rules
        run: npm test
      - name: D1 SQLite schema and transaction checks
        run: python3 -m unittest discover -s test -p '*_test.py'
      - name: Wrangler local D1 integration smoke
        run: |
          npm run db:local
          npm run dev -- --port 8787 > /tmp/companies-wrangler.log 2>&1 &
          node test/smoke.mjs || (cat /tmp/companies-wrangler.log && exit 1)
